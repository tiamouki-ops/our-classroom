
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>그때 우리 교실 V0.2</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#27352f;color:#fff;
font-family:system-ui,sans-serif;text-align:center}
header{padding:12px;background:#365845}
h2{margin:0}p{margin:5px;font-size:13px}
canvas{display:block;width:min(96%,960px);
aspect-ratio:16/9;margin:12px auto;
border:5px solid #b98c59;image-rendering:pixelated;
background:#81b776}
#status{min-height:28px;color:#ffe6a0}
.controls{display:grid;grid-template-columns:repeat(3,56px);
gap:6px;justify-content:center;margin:12px}
button{height:48px;font-size:23px;border:0;
border-radius:7px;background:#d6bd8c;
touch-action:none}
#action{font-size:12px;background:#8bc9aa}
</style>
</head>
<body>
<header>
<h2>🏫 그때 우리 교실</h2>
<p>추억의 마을 V0.2 · 우리집 입장하기</p>
</header>
<canvas id="game" width="960" height="540"></canvas>
<div id="status">방향키로 우리집을 찾아가 보세요!</div>
<div class="controls">
<div></div><button data-key="ArrowUp">▲</button><div></div>
<button data-key="ArrowLeft">◀</button>
<button data-key="ArrowDown">▼</button>
<button data-key="ArrowRight">▶</button>
<div></div><button id="action">SPACE</button><div></div>
</div>
<script>
const canvas=document.querySelector("#game");
const ctx=canvas.getContext("2d");
const status=document.querySelector("#status");
ctx.imageSmoothingEnabled=false;

const W=2048,H=1536;
const keys=new Set();
let scene="village",last=performance.now();
const player={x:1020,y:740,speed:185,step:0};
let previousPosition={x:320,y:485};

const buildings=[
{name:"우리집",x:150,y:185,w:340,h:245,
 roof:"#a95443",wall:"#e4c89c"},
{name:"추억의 학교",x:1050,y:145,w:650,h:350,
 roof:"#aa5145",wall:"#d9a580"},
{name:"음악가게",x:160,y:920,w:340,h:245,
 roof:"#a86a76",wall:"#e6c5a9"},
{name:"학교앞 문구사",x:805,y:930,w:385,h:245,
 roof:"#659a88",wall:"#edd4a7"},
{name:"오락실",x:1470,y:920,w:350,h:250,
 roof:"#66539b",wall:"#b4a9d9"}
];

let seed=17;
function rand(){
seed=(seed*1664525+1013904223)>>>0;
return seed/4294967296;
}

const trees=[];
function road(x,y){
return (y>640&&y<835)||
(x>325&&x<410)||
(x>975&&x<1080)||
(x>1600&&x<1690);
}
for(let i=0;i<130;i++){
const x=50+rand()*(W-100);
const y=60+rand()*(H-120);
if(road(x,y))continue;
if(buildings.some(b=>
 x>b.x-80&&x<b.x+b.w+80&&
 y>b.y-80&&y<b.y+b.h+80))continue;
trees.push({x,y,r:24+rand()*12});
}

const furniture=[
{x:100,y:110,w:145,h:75,name:"침대",color:"#8ca9c6"},
{x:665,y:100,w:170,h:70,name:"책장",color:"#93633c"},
{x:110,y:335,w:130,h:85,name:"TV",color:"#797b80"},
{x:620,y:320,w:145,h:75,name:"책상",color:"#af8153"},
{x:380,y:210,w:180,h:100,name:"탁자",color:"#b18b62"}
];

function rect(x,y,w,h,color){
ctx.fillStyle=color;
ctx.fillRect(Math.round(x),Math.round(y),w,h);
}
function label(value,x,y,size=20,color="#fff"){
ctx.font=`bold ${size}px sans-serif`;
ctx.textAlign="center";
ctx.lineWidth=4;
ctx.strokeStyle="#493729";
ctx.strokeText(value,x,y);
ctx.fillStyle=color;
ctx.fillText(value,x,y);
}
function collision(x,y){
const r=11;
if(scene==="home"){
if(x<58+r||x>902-r||y<65+r||y>490-r)return true;
return furniture.some(f=>
x+r>f.x&&x-r<f.x+f.w&&
y+r>f.y&&y-r<f.y+f.h);
}
if(x<r||x>W-r||y<r||y>H-r)return true;
if(buildings.some(b=>
x+r>b.x&&x-r<b.x+b.w&&
y+r>b.y+24&&y-r<b.y+b.h))return true;
return trees.some(t=>
Math.hypot(x-t.x,y-t.y)<t.r*.57+r);
}
function move(dx,dy,dt){
if(!dx&&!dy)return;
const n=Math.hypot(dx,dy);
const vx=dx/n*player.speed*dt;
const vy=dy/n*player.speed*dt;
if(!collision(player.x+vx,player.y))player.x+=vx;
if(!collision(player.x,player.y+vy))player.y+=vy;
player.step+=dt*10;
}

function nearDoor(){
if(scene==="home"){
return Math.hypot(player.x-480,player.y-463)<75
?"exit":null;
}
for(const b of buildings){
const doorX=b.x+b.w/2;
const doorY=b.y+b.h+18;
if(Math.hypot(player.x-doorX,player.y-doorY)<100)
return b.name;
}
return null;
}

function action(){
const place=nearDoor();
if(scene==="home"){
if(place==="exit"){
scene="village";
player.x=previousPosition.x;
player.y=previousPosition.y;
status.textContent="우리 동네로 돌아왔어!";
}else{
status.textContent="현관 앞으로 이동해 봐.";
}
return;
}
if(place==="우리집"){
previousPosition={x:player.x,y:player.y};
scene="home";
player.x=480;
player.y=415;
status.textContent="어서 와! 여기가 우리집이야.";
}else if(place){
status.textContent=place+"은 다음 버전에 열릴 예정이야!";
}else{
status.textContent="건물 현관 앞에서 Space를 눌러 봐.";
}
}

function drawBuilding(b){
rect(b.x+9,b.y+40,b.w,b.h,"#58704f");
rect(b.x,b.y+30,b.w,b.h-30,b.wall);
rect(b.x-12,b.y,b.w+24,68,b.roof);
for(let i=0;i<3;i++){
const x=b.x+35+i*(b.w-95)/3;
rect(x,b.y+110,48,55,"#f8eab4");
rect(x+21,b.y+110,6,55,"#b28e69");
}
const cx=b.x+b.w/2;
rect(cx-34,b.y+b.h-82,68,82,"#76513a");
rect(cx-6,b.y+b.h-74,12,70,"#c9b38f");
rect(cx-85,b.y+50,170,43,"#675039");
label(b.name,cx,b.y+79,21);
}
function drawTree(t){
rect(t.x-7,t.y,14,30,"#896044");
rect(t.x-t.r,t.y-t.r,t.r*2,t.r*1.8,"#477748");
rect(t.x-t.r+6,t.y-t.r+5,t.r*1.5,t.r,"#70a65b");
}
function drawPlayer(){
const x=Math.round(player.x),y=Math.round(player.y);
const bob=Math.sin(player.step)*2;
rect(x-10,y-5+bob,20,24,"#3569bc");
rect(x-13,y-26+bob,26,23,"#f3c6a1");
rect(x-15,y-31+bob,30,11,"#302522");
rect(x-7,y-16+bob,4,4,"#302522");
rect(x+5,y-16+bob,4,4,"#302522");
rect(x-9,y+17+bob,7,8,"#383638");
rect(x+3,y+17+bob,7,8,"#383638");
label("나",x,y-40,17);
}

function drawVillage(){
rect(0,0,W,H,"#87b879");
for(let y=0;y<H;y+=64)
for(let x=0;x<W;x+=64)
if((x+y)/64%2===0)
rect(x,y,64,64,"#81b274");

rect(0,640,W,195,"#d5bc93");
rect(325,0,85,H,"#d5bc93");
rect(975,0,105,H,"#d5bc93");
rect(1600,0,90,H,"#d5bc93");

for(let x=0;x<W;x+=80)
rect(x,732,35,5,"#f2e4c7");

buildings.forEach(drawBuilding);
trees.forEach(drawTree);
drawPlayer();
}

function drawHome(){
rect(0,0,960,540,"#b58b60");
rect(58,65,844,425,"#d5b78c");
for(let y=75;y<490;y+=55)
rect(60,y,840,3,"#c9a57b");
rect(58,65,844,18,"#7c5940");
rect(58,65,18,425,"#7c5940");
rect(884,65,18,425,"#7c5940");
rect(58,490,844,16,"#7c5940");

rect(350,110,250,55,"#a4cadd");
rect(360,117,230,40,"#d5eaf0");

for(const f of furniture){
rect(f.x+7,f.y+8,f.w,f.h,"#9d805e");
rect(f.x,f.y,f.w,f.h,f.color);
label(f.name,f.x+f.w/2,f.y+f.h/2+7,19);
}
rect(412,474,136,31,"#74513b");
label("현관 출구",480,468,18);
label("🏠 우리집",480,43,28);
drawPlayer();
}

function frame(now){
const dt=Math.min((now-last)/1000,.04);
last=now;
let dx=0,dy=0;
if(keys.has("ArrowLeft")||keys.has("a"))dx--;
if(keys.has("ArrowRight")||keys.has("d"))dx++;
if(keys.has("ArrowUp")||keys.has("w"))dy--;
if(keys.has("ArrowDown")||keys.has("s"))dy++;
move(dx,dy,dt);

ctx.clearRect(0,0,960,540);
if(scene==="village"){
const cx=Math.max(0,Math.min(W-960,player.x-480));
const cy=Math.max(0,Math.min(H-540,player.y-270));
ctx.save();
ctx.translate(-Math.round(cx),-Math.round(cy));
drawVillage();
ctx.restore();
}else{
drawHome();
}

const place=nearDoor();
if(place&&(!dx&&!dy)){
status.textContent=scene==="home"
?"현관 앞이야! Space를 누르면 밖으로 나가."
:place+" 앞이야! Space를 눌러 봐.";
}
requestAnimationFrame(frame);
}
window.addEventListener("keydown",e=>{
if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"]
.includes(e.code)||e.key===" ")e.preventDefault();
keys.add(e.key.startsWith("Arrow")?e.key:e.key.toLowerCase());
if(e.code==="Space"&&!e.repeat)action();
});
window.addEventListener("keyup",e=>{
keys.delete(e.key.startsWith("Arrow")?e.key:e.key.toLowerCase());
});
window.addEventListener("blur",()=>keys.clear());
document.querySelectorAll("[data-key]").forEach(b=>{
const key=b.dataset.key;
b.onpointerdown=e=>{
e.preventDefault();
keys.add(key);
b.setPointerCapture(e.pointerId);
};
b.onpointerup=b.onpointercancel=()=>keys.delete(key);
});
document.querySelector("#action").onclick=action;
requestAnimationFrame(frame);
</script>
</body>
</html>
