303,"r":35},{"id":"t23","type":"tree","name":"나무","x":761,"y":139,"r":33},{"id":"t24","type":"tree","name":"나무","x":1111,"y":837,"r":25},{"id":"t25","type":"tree","name":"나무","x":1985,"y":1286,"r":27},{"id":"t26","type":"tree","name":"나무","x":1371,"y":638,"r":24},{"id":"t27","type":"tree","name":"나무","x":773,"y":622,"r":26},{"id":"t28","type":"tree","name":"나무","x":1923,"y":1447,"r":26},{"id":"t29","type":"tree","name":"나무","x":1545,"y":1353,"r":32},{"id":"t30","type":"tree","name":"나무","x":597,"y":245,"r":36},{"id":"t31","type":"tree","name":"나무","x":1964,"y":1019,"r":34},{"id":"t32","type":"tree","name":"나무","x":1106,"y":1280,"r":34},{"id":"t33","type":"tree","name":"나무","x":1707,"y":1344,"r":25},{"id":"t34","type":"tree","name":"나무","x":1974,"y":221,"r":30},{"id":"t35","type":"tree","name":"나무","x":134,"y":1350,"r":29},{"id":"t36","type":"tree","name":"나무","x":810,"y":1336,"r":26},{"id":"t37","type":"tree","name":"나무","x":1257,"y":1430,"r":30},{"id":"t38","type":"tree","name":"나무","x":534,"y":1254,"r":28},{"id":"t39","type":"tree","name":"나무","x":1407,"y":1271,"r":29},{"id":"t40","type":"tree","name":"나무","x":426,"y":1434,"r":33},{"id":"t41","type":"tree","name":"나무","x":418,"y":581,"r":35},{"id":"t42","type":"tree","name":"나무","x":72,"y":1452,"r":32},{"id":"t43","type":"tree","name":"나무","x":661,"y":1038,"r":25},{"id":"t44","type":"tree","name":"나무","x":115,"y":77,"r":31},{"id":"t45","type":"tree","name":"나무","x":1836,"y":1371,"r":30},{"id":"t46","type":"tree","name":"나무","x":958,"y":1396,"r":27},{"id":"t47","type":"tree","name":"나무","x":1976,"y":604,"r":31},{"id":"t48","type":"tree","name":"나무","x":759,"y":1427,"r":30},{"id":"t49","type":"tree","name":"나무","x":1771,"y":578,"r":28},{"id":"t50","type":"tree","name":"나무","x":1870,"y":543,"r":34}]};
let buildings = [];
let trees = [];
let decor = [];
function applyMap(data){
 if(!data || !Array.isArray(data.objects)) return false;
 const clean = data.objects.filter(o=>o && typeof o.x==='number' && typeof o.y==='number');
 buildings = clean.filter(o=>o.type==='building').map(o=>({...o}));
 trees = clean.filter(o=>o.type==='tree').map(o=>({...o}));
 decor = clean.filter(o=>o.type==='bench'||o.type==='statue').map(o=>({...o}));
 return true;
}
applyMap(DEFAULT_MAP);
fetch('./village-map.json',{cache:'no-store'})
 .then(r=>{if(!r.ok)throw Error('map missing');return r.json()})
 .then(data=>{if(applyMap(data))console.info('마을 맵 불러오기 성공')})
 .catch(()=>console.info('내장 기본 마을 맵 사용'));
function rand(){ return 0.5; } // 기존 임의 나무 생성 대신 맵 데이터 사용

const classroomDesks = [];
for (const y of [190,305]) for (const x of [145,385,625]) classroomDesks.push({x,y,w:170,h:65});
const hallwayObjects=[{x:80,y:250,w:120,h:74},{x:810,y:260,w:70,h:130}];

const furniture=[
{x:100,y:110,w:145,h:75,name:"침대",color:"#8ca9c6"},
{x:665,y:100,w:170,h:70,name:"책장",color:"#93633c"},
{x:110,y:335,w:130,h:85,name:"TV",color:"#797b80"},
{x:620,y:320,w:145,h:75,name:"책상",color:"#af8153"},
{x:380,y:210,w:180,h:100,name:"탁자",color:"#b18b62"}
];

function rect(x,y,w,h,color){
ctx.fillStyle=color;
ctx.fillRect(Math.round(x),Math.round(y),w,h);
}
function label(value,x,y,size=20,color="#fff"){
ctx.font=`bold ${size}px sans-serif`;
ctx.textAlign="center";
ctx.lineWidth=4;
ctx.strokeStyle="#493729";
ctx.strokeText(value,x,y);
ctx.fillStyle=color;
ctx.fillText(value,x,y);
}
function collision(x,y){
const r=11;
if(scene==="home"){
if(x<58+r||x>902-r||y<65+r||y>490-r)return true;
return furniture.some(f=>
x+r>f.x&&x-r<f.x+f.w&&
y+r>f.y&&y-r<f.y+f.h);
}
if(scene==="hallway"){
  if(x<42+r||x>918-r||y<75+r||y>500-r)return true;
  return hallwayObjects.some(o=>x+r>o.x&&x-r<o.x+o.w&&y+r>o.y&&y-r<o.y+o.h);
}
if(scene==="classroom"){
  if(x<45+r||x>915-r||y<75+r||y>500-r)return true;
  return classroomDesks.some(o=>x+r>o.x&&x-r<o.x+o.w&&y+r>o.y&&y-r<o.y+o.h)
    || (x+r>427&&x-r<533&&y+r>105&&y-r<156);
}
if(x<r||x>W-r||y<r||y>H-r)return true;
if(buildings.some(b=>
x+r>b.x&&x-r<b.x+b.w&&
y+r>b.y+24&&y-r<b.y+b.h))return true;
return trees.some(t=>Math.hypot(x-t.x,y-t.y)<t.r*.57+r) ||
 decor.some(o=>x+r>o.x&&x-r<o.x+(o.w||55)&&y+r>o.y&&y-r<o.y+(o.h||22));
}
function move(dx,dy,dt){
if (dialogOpen) return;
if(!dx&&!dy)return;
const n=Math.hypot(dx,dy);
const vx=dx/n*player.speed*dt;
const vy=dy/n*player.speed*dt;
if(!collision(player.x+vx,player.y))player.x+=vx;
if(!collision(player.x,player.y+vy))player.y+=vy;
player.step+=dt*10;
}

function nearDoor(){
  if(scene==="home") return Math.hypot(player.x-480,player.y-463)<75 ? "exit-home" : null;
  if(scene==="hallway") {
    if(Math.hypot(player.x-480,player.y-466)<76) return "exit-school";
    if(Math.hypot(player.x-740,player.y-168)<90) return "enter-classroom";
    return null;
  }
  if(scene==="classroom") return Math.hypot(player.x-480,player.y-455)<76 ? "exit-classroom" : null;
  for(const b of buildings){
    const doorX=b.x+b.w/2, doorY=b.y+b.h+18;
    if(Math.hypot(player.x-doorX,player.y-doorY)<100) return b.name;
  }
  return null;
}

function nearIseol() {
  return scene === "village" &&
    Math.hypot(
      player.x - iseol.x,
      player.y - iseol.y
    ) < 65;
}

function openIseol() {
  dialogOpen = true;
  keys.clear();
  dialog.style.display = "flex";
  document.getElementById("iseol-answer")
    .textContent = "어서 와~ 친구야! 무엇이 궁금해?";
}

function closeIseol() {
  dialogOpen = false;
  dialog.style.display = "none";
}

document.getElementById("iseol-close")
  .onclick = closeIseol;

function drawIseol() {
  const x = iseol.x, y = iseol.y;

  rect(x-10,y-5,20,25,"#57846b");
  rect(x-13,y-27,26,24,"#f2c49e");
  rect(x-16,y-34,32,15,"#70442e");
  rect(x-8,y-18,4,4,"#302521");
  rect(x+5,y-18,4,4,"#302521");
  rect(x-9,y+19,8,7,"#43352c");
  rect(x+2,y+19,8,7,"#43352c");

  label("이설이",x,y-43,18,"#fff3ad");
  if (nearIseol()) {
    label("SPACE 대화",x,y-65,15);
  }
}
/* ===== NPC 코드 끝 ===== */
  
function action(){
  if(dialogOpen) return;
  if(nearIseol()) { openIseol(); return; }
  const place=nearDoor();
  if(scene==="home") {
    if(place==="exit-home") {
      scene="village"; player.x=previousPosition.x;player.y=previousPosition.y;
      status.textContent="우리 동네로 돌아왔어!";
    } else status.textContent="현관 앞으로 이동해 봐.";
    return;
  }
  if(scene==="hallway") {
    if(place==="exit-school") {
      scene="village";player.x=schoolReturnPosition.x;player.y=schoolReturnPosition.y;
      status.textContent="학교 밖 마을로 나왔어!";
    } else if(place==="enter-classroom") {
      scene="classroom";player.x=480;player.y=428;
      status.textContent="추억의 교실에 들어왔어! 2인용 책상이 보이지?";
    } else status.textContent="교실 문이나 학교 출입구 근처로 가 봐.";
    return;
  }
  if(scene==="classroom") {
    if(place==="exit-classroom") {
      scene="hallway";player.x=740;player.y=232;
      status.textContent="학교 복도로 돌아왔어!";
    } else status.textContent="교실 출입구 근처로 가 봐.";
    return;
  }
  if(place==="우리집") {
    previousPosition={x:player.x,y:player.y};
    scene="home";player.x=480;player.y=415;
    status.textContent="어서 와! 여기가 우리집이야.";
  } else if(place==="추억의 학교") {
    schoolReturnPosition={x:player.x,y:player.y};
    scene="hallway";player.x=480;player.y=414;
    status.textContent="학교 복도에 들어왔어! 오른쪽 위 2반 교실로 가 봐.";
  } else if(place) {
    status.textContent=place+"은 다음 버전에 열릴 예정이야!";
  } else status.textContent="건물 현관 앞에서 Space를 눌러 봐.";
}

function drawBuilding(b){
rect(b.x+9,b.y+40,b.w,b.h,"#58704f");
rect(b.x,b.y+30,b.w,b.h-30,b.wall);
rect(b.x-12,b.y,b.w+24,68,b.roof);
for(let i=0;i<3;i++){
const x=b.x+35+i*(b.w-95)/3;
rect(x,b.y+110,48,55,"#f8eab4");
rect(x+21,b.y+110,6,55,"#b28e69");
}
const cx=b.x+b.w/2;
rect(cx-34,b.y+b.h-82,68,82,"#76513a");
rect(cx-6,b.y+b.h-74,12,70,"#c9b38f");
rect(cx-85,b.y+50,170,43,"#675039");
label(b.name,cx,b.y+79,21);
}
function drawTree(t){
rect(t.x-7,t.y,14,30,"#896044");
rect(t.x-t.r,t.y-t.r,t.r*2,t.r*1.8,"#477748");
rect(t.x-t.r+6,t.y-t.r+5,t.r*1.5,t.r,"#70a65b");
}

function drawDecor(o){
 const w=o.w||55,h=o.h||22;
 if(o.type==='bench'){
  rect(o.x,o.y,w,h,'#98643c');
  rect(o.x+3,o.y+4,w-6,5,'#d29b60');
  rect(o.x+7,o.y+h,6,6,'#58402e');
  rect(o.x+w-13,o.y+h,6,6,'#58402e');
 }else{
  rect(o.x,o.y,w,h,'#9e9e9e');
  rect(o.x+w*.3,o.y-18,w*.4,20,'#c8c8c8');
  label('★',o.x+w/2,o.y-3,16,'#f8db7b');
 }
}
function drawPlayer(){
const x=Math.round(player.x),y=Math.round(player.y);
const bob=Math.sin(player.step)*2;
rect(x-10,y-5+bob,20,24,"#3569bc");
rect(x-13,y-26+bob,26,23,"#f3c6a1");
rect(x-15,y-31+bob,30,11,"#302522");
rect(x-7,y-16+bob,4,4,"#302522");
rect(x+5,y-16+bob,4,4,"#302522");
rect(x-9,y+17+bob,7,8,"#383638");
rect(x+3,y+17+bob,7,8,"#383638");
label("나",x,y-40,17);
}

function drawVillage(){
rect(0,0,W,H,"#87b879");
for(let y=0;y<H;y+=64)
for(let x=0;x<W;x+=64)
if((x+y)/64%2===0)
rect(x,y,64,64,"#81b274");

rect(0,640,W,195,"#d5bc93");
rect(325,0,85,H,"#d5bc93");
rect(975,0,105,H,"#d5bc93");
rect(1600,0,90,H,"#d5bc93");

for(let x=0;x<W;x+=80)
rect(x,732,35,5,"#f2e4c7");

buildings.forEach(drawBuilding);
trees.forEach(drawTree);
decor.forEach(drawDecor);
drawIseol();
drawPlayer();
}

function drawHallway(){

function frame(now){
const dt=Math.min((now-last)/1000,.04);
last=now;
let dx=0,dy=0;
if(keys.has("ArrowLeft")||keys.has("a"))dx--;
if(keys.has("ArrowRight")||keys.has("d"))dx++;
if(keys.has("ArrowUp")||keys.has("w"))dy--;
if(keys.has("ArrowDown")||keys.has("s"))dy++;
move(dx,dy,dt);

ctx.clearRect(0,0,960,540);
if(scene==="village"){
const cx=Math.max(0,Math.min(W-960,player.x-480));
const cy=Math.max(0,Math.min(H-540,player.y-270));
ctx.save();
ctx.translate(-Math.round(cx),-Math.round(cy));
drawVillage();
ctx.restore();
}else if(scene==="home"){
  drawHome();
}else if(scene==="hallway"){
  drawHallway();
}else if(scene==="classroom"){
  drawClassroom();
}

const place=nearDoor();
if(place&&!dialogOpen&&(!dx&&!dy)){
const hints={"exit-home":"현관 앞이야! Space를 누르면 밖으로 나가.","exit-school":"학교 출입구야! Space를 누르면 마을로 돌아가.","enter-classroom":"6학년 2반 교실 문이야! Space를 눌러봐.","exit-classroom":"교실 문이야! Space를 누르면 복도로 나가."};
status.textContent=hints[place] || place+" 앞이야! Space를 눌러 봐.";
}
requestAnimationFrame(frame);
}
window.addEventListener("keydown",e=>{
if (e.key === "Escape" && dialogOpen) {
  e.preventDefault();
  closeIseol();
  return;
}
if (dialogOpen) {
  if (e.code === "Space") e.preventDefault();
  return;
}
 
if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"]
.includes(e.code)||e.key===" ")e.preventDefault();
keys.add(e.key.startsWith("Arrow")?e.key:e.key.toLowerCase());
if(e.code==="Space"&&!e.repeat)action();
});
window.addEventListener("keyup",e=>{
keys.delete(e.key.startsWith("Arrow")?e.key:e.key.toLowerCase());
});
window.addEventListener("blur",()=>keys.clear());
document.querySelectorAll("[data-key]").forEach(b=>{
const key=b.dataset.key;
b.onpointerdown=e=>{
e.preventDefault();
keys.add(key);
b.setPointerCapture(e.pointerId);
};
b.onpointerup=b.onpointercancel=()=>keys.delete(key);
});
document.querySelector("#action").onclick=action;
requestAnimationFrame(frame);
</script>
